<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--ac:#f37021;--ok:#16a34a;--bad:#dc2626;--bd:#e3e5ee;--cur:#ffd9c2;--badbg:#fee2e2}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1220;--card:#1a1e30;--tx:#eceefa;--mu:#9aa0b8;--ac:#ff8a4c;--ok:#4ade80;--bad:#f87171;--bd:#2c3150;--cur:#5a3a28;--badbg:#431a1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0;font-size:30px;line-height:1.1}h1 span{color:var(--ac)}h1 .org{display:block;color:var(--mu);font-size:13px;font-weight:700;letter-spacing:2px;margin-bottom:2px}.brand{display:flex;align-items:center;gap:14px}.brand img{height:52px;width:auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{padding:8px 14px}.me-row td{background:var(--cur);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:180px}
input,select,textarea.f{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.mu{color:var(--mu);font-size:14px}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.pl{grid-template-columns:1fr}}
.p{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px}.p.me{border-color:var(--ac)}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.st{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}.st b{font-size:20px}
.timer{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.txt{font:24px/1.9 "Segoe UI","Be Vietnam Pro",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:12px;user-select:none;height:260px;overflow-y:auto;position:relative}
.txt span{padding:1px 3px;border-radius:4px}.txt .ok{color:var(--ok)}.txt .bad{background:var(--badbg);color:var(--bad);text-decoration:underline wavy}.txt .cur{background:var(--cur);box-shadow:0 0 0 2px var(--ac)}
textarea.in{width:100%;height:90px;margin-top:12px;padding:12px;border-radius:12px;border:2px solid var(--ac);background:var(--card);color:var(--tx);font:20px/1.5 "Segoe UI",Roboto,Arial,sans-serif;resize:none}
.win{font-size:28px;font-weight:800;text-align:center;margin:6px 0 14px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:center;border-bottom:1px solid var(--bd)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--bd)}
.big{font-size:60px;text-align:center}
#cel{position:fixed;inset:0;z-index:99;background:rgba(10,12,30,.9);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;cursor:pointer;padding:20px}
#cv{position:absolute;inset:0;width:100%;height:100%}.cbox{position:relative}
.cn{font-size:clamp(34px,8vw,84px);font-weight:900;color:#ffb347;margin:8px 0;line-height:1.1}.cs{font-size:clamp(16px,3vw,30px);font-weight:700}
.txt span::before{content:attr(data-w)}
a.brand{text-decoration:none;color:inherit}
.timer2{font-size:36px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0 0}
.timer.warn,.timer2.warn{color:var(--bad)}
.playing{overflow:hidden}
.playing .wrap{height:var(--vh,100dvh);display:flex;flex-direction:column;padding-top:8px;padding-bottom:8px}
.playing #app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.playing .txt{flex:1 1 0;height:auto;min-height:60px;margin-top:8px}
.playing .timer{font-size:30px;margin:0;flex:none}.playing .timer2{font-size:30px;margin:6px 0 0;flex:none}
.playing textarea.in{height:72px;margin-top:8px;flex:none}
.playing .pl{flex:none}.playing .p{padding:8px 12px}.playing .p .bar{margin:4px 0}
.playing .brand img{height:38px}

<div id="app"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k){try{return localStorage.getItem(k)||''}catch(e){return''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let TL={},CHEAT='',wantAdmin=false,lbFrom='home',CA=null,CR=null,clsSel='',wantCls=false,clsCode='',ctm=null,cval='',SP=null,celId=null,celRAF=0,LBD=null,lbDur=2,ws,S=null,view='home',name=LS.get('tp_name'),mssv=LS.get('tp_mssv'),dur=2,err='',A=null,ta=null,focused=false;

function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{$('#cn').textContent=''};
  ws.onclose=()=>{$('#cn').textContent='Mất kết nối, đang thử lại…';view='home';S=null;ta=null;render();setTimeout(connect,1500)};
  ws.onmessage=e=>on(JSON.parse(e.data));
}
const tx=o=>ws.readyState===1&&ws.send(JSON.stringify(o));
function on(m){
  if(m.t==='hello'){dur=m.duration;const tk=ck('tp_staff');if(tk)tx({t:'resume',token:tk});if(view==='home')render()}
  else if(m.t==='state'){if(m.cls&&!m.text&&S&&S.cls&&S.text&&S.cls.code===m.cls.code)m.text=S.text;S=m;S.t0=performance.now();view=m.status==='waiting'?'wait':'game';render()}
  else if(m.t==='clsadmin'){CA=m;CA.t0=performance.now();
    if(wantCls){wantCls=false;view='cls';render()}else if(view==='cls')updCls();
    if(m.sid&&celId!==m.sid){celId=m.sid;if(view==='cls'&&m.players.length&&m.players[0].score>0)celebrate(m.players[0])}}
  else if(m.t==='clserr'){wantCls=false;alert(m.msg)}
  else if(m.t==='clsres'){CR=m.session;if(view==='lb')render()}
  else if(m.t==='clsclosed'){err='Giám thị đã hủy lớp thi.';reset()}
  else if(m.t==='joinerr'){err=m.msg;render()}
  else if(m.t==='lb'){LBD=m.data;LBD.classes=m.classes;LBD.classTop=m.classTop;if(view==='lb')render()}
  else if(m.t==='resync'){if(ta)ta.value=m.text}
  else if(m.t==='aborted'){err='Đối thủ đã thoát trước khi bắt đầu.';reset()}
  else if(m.t==='adminfail'){wantAdmin=false;alert('Sai mật khẩu giám thị')}
  else if(m.t==='stafftoken'){setCk('tp_staff',m.token,43200)}
  else if(m.t==='resumefail'){setCk('tp_staff','',0)}
  else if(m.t==='cheat'){CHEAT=m.reason||'bất thường';if(ta)ta.disabled=true;if(view==='game')update()}
  else if(m.t==='admin'){A=m;if(wantAdmin&&view==='home'){wantAdmin=false;view='admin';render()}else if(view==='admin'){if(!(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)))render()}else if(view==='home')setNav()}
  else if(m.t==='backup')saveBackup(m.data)
  else if(m.t==='spec'){SP=m;SP.t0=performance.now();
    if(!m.gone&&m.status==='finished'&&!m.solo&&celId!==m.id){celId=m.id;celebrate(m.result&&m.result.winner>=0?m.players[m.result.winner]:null)}
    if(view==='spec')updSpec()}
}
function reset(){S=null;ta=null;focused=false;CHEAT='';view='home';render()}
function leave(){tx({t:'leave'});err='';reset()}
function join(solo){
  name=($('#nm').value||'').replace(/\s+/g,' ').trim();mssv=($('#ms').value||'').trim().toUpperCase();
  LS.set('tp_name',name);LS.set('tp_mssv',mssv);
  if(name.length<2){err='Vui lòng nhập họ tên.';return render()}
  if(!/^[A-Z0-9]{5,15}$/.test(mssv)){err='MSSV không hợp lệ (5–15 ký tự chữ hoặc số, ví dụ TH12345).';return render()}
  err='';tx({t:'join',name,mssv,code:solo?'':$('#cd').value,solo})
}
function joinClass(){
  name=($('#nm').value||'').replace(/\s+/g,' ').trim();mssv=($('#ms').value||'').trim().toUpperCase();clsCode=($('#cc').value||'').trim().toUpperCase();
  const pw=$('#cp').value||'';LS.set('tp_name',name);LS.set('tp_mssv',mssv);
  if(name.length<2){err='Vui lòng nhập họ tên.';return render()}
  if(!/^[A-Z0-9]{5,15}$/.test(mssv)){err='MSSV không hợp lệ (5–15 ký tự chữ hoặc số, ví dụ TH12345).';return render()}
  if(!clsCode||!pw){err='Nhập mã lớp và mật khẩu lớp.';return render()}
  err='';tx({t:'joinclass',name,mssv,code:clsCode,password:pw})
}
function adminLogin(){const p=prompt('Mật khẩu giám thị:');if(p){wantAdmin=true;tx({t:'admin',pass:p})}}
function ck(n){const m=(document.cookie||'').match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):''}
function setCk(n,v,age){document.cookie=n+'='+encodeURIComponent(v)+'; Max-Age='+age+'; Path=/; SameSite=Strict'+(location.protocol==='https:'?'; Secure':'')}
function openStaff(){view='admin';render()}
function staffLogout(){tx({t:'stafflogout'});setCk('tp_staff','',0);A=null;CA=null;wantAdmin=false;if(view==='admin'||view==='cls'||view==='spec')view='home';closeCel();render()}
function goHome(){ // về trang chủ nhưng KHÔNG thoát giám thị
  if(view==='game'||view==='wait'){if(S&&S.status==='running'&&!confirm('Thoát khỏi bài thi? Bạn sẽ không được tính điểm.'))return;return leave()}
  if(view==='spec')tx({t:'unwatch'});
  closeCel();view='home';render();
}
function leaveSolo(){if(!S||S.status==='running'){if(!confirm('Thoát khỏi bài thi? Bạn sẽ không được tính điểm.'))return}leave()}

function setNav(){
  $('#nav').innerHTML=view==='home'?'<button class="g" onclick="openLB()">🏆 Bảng xếp hạng</button> '+(A?'<button onclick="openStaff()">🛠 Khu giám thị'+(A.role===2?' (lớp)':'')+'</button> <button class="g" onclick="staffLogout()">Đăng xuất</button>':'<button class="g" onclick="adminLogin()">🛠 Giám thị</button>'):view==='spec'?'<button class="g" onclick="stopWatch()">← Quay lại</button>':view==='cls'?'<button class="g" onclick="view=\'admin\';render()">← Giám thị</button>':view==='admin'?'<button class="g" onclick="goHome()">← Trang chủ</button> <button class="g" onclick="staffLogout()">Đăng xuất</button>':view==='lb'?'<button class="g" onclick="backFromLB()">← Quay lại</button>':'';
}
function render(){
  const a=$('#app');fitTxt();
  setNav();
  if(view==='home')a.innerHTML=`<div class="card"><h2 style="margin-top:0">Thi gõ đối kháng 1–1</h2>
  <p class="mu">Hai người vào cùng một phòng, gõ cùng một đoạn tiếng Việt. Điểm = tốc độ (WPM) × độ chính xác². Chấm theo từng từ: chỉ từ gõ đúng hoàn toàn mới được tính tốc độ, và gõ sai một từ không ảnh hưởng các từ sau. Thời gian mỗi lượt: <b>${dur} phút</b>.<br>MSSV là duy nhất, dùng để định danh bạn và lưu điểm cao nhất. Lần đầu nhập sẽ đăng ký họ tên cho MSSV đó; các lần sau phải nhập đúng họ tên.</p>
  ${err?`<p style="color:var(--bad)">${esc(err)}</p>`:''}
  <div class="row"><div class="grow"><label>Họ và tên</label><input id="nm" value="${esc(name)}" maxlength="40" placeholder="Nguyễn Văn A"></div><div class="grow"><label>MSSV (duy nhất)</label><input id="ms" value="${esc(mssv)}" maxlength="15" placeholder="TH12345" autocapitalize="characters" style="text-transform:uppercase"></div>
  <div class="grow"><label>Mã phòng (tuỳ chọn, để ghép đúng cặp)</label><input id="cd" maxlength="20" placeholder="Để trống = ghép tự động"></div></div>
  <div class="row" style="margin-top:14px"><button onclick="join(false)">⚔️ Vào phòng thi</button><button class="g" onclick="join(true)">Thi một mình</button></div></div>
  <div class="card"><h3 style="margin:0 0 4px">🏫 Thi theo lớp</h3><p class="mu" style="margin-top:0">Giám thị cung cấp mã lớp và mật khẩu. Cả lớp vào phòng chờ và thi cùng lúc trên cùng một đoạn văn. (Nhập Họ tên và MSSV ở trên.)</p>
  <div class="row"><div class="grow"><label>Mã lớp</label><input id="cc" value="${esc(clsCode)}" maxlength="20" placeholder="SD2101" style="text-transform:uppercase"></div><div class="grow"><label>Mật khẩu lớp</label><input id="cp" type="password" maxlength="30" autocomplete="off"></div><button onclick="joinClass()">Vào lớp thi</button></div></div>
  <div class="card mu">Giữ đúng dấu tiếng Việt, dùng Space để sang từ tiếp theo và Backspace để sửa lỗi. Từ nào gõ sai sẽ tô đỏ sau khi bạn bấm Space. Dán văn bản bị chặn.</div>`;
  else if(view==='wait'&&S.cls)a.innerHTML=`<div class="card" style="text-align:center"><div class="big">🏫</div><h2>Lớp ${esc(S.cls.code)}</h2><p>Bạn đã vào lớp. Đang chờ giám thị bắt đầu…</p><p class="mu">Số sinh viên đã vào: <b>${S.cls.count}</b></p><button class="g" onclick="leave()">Thoát lớp</button></div>`;
  else if(view==='wait')a.innerHTML=`<div class="card" style="text-align:center"><div class="big">⏳</div><h2>Đang chờ đối thủ…</h2><p class="mu">Mã phòng: <b>${esc(S.code)}</b>. Người thứ hai nhập cùng mã (hoặc để trống mã) sẽ vào phòng này.</p><button class="g" onclick="leave()">Hủy</button></div>`;
  else if(view==='game'){if(!ta)build(a);update()}
  else if(view==='admin')adminView(a);
  else if(view==='lb')lbView(a);
  else if(view==='cls')clsView(a);
  else if(view==='spec')a.innerHTML='<div id="sp"></div><div class="row" style="justify-content:center;margin-top:14px"><button id="cb" onclick="celebrateSP()" style="display:none">🎉 Tung hô người thắng</button></div>',updSpec();
}
function build(a){
  a.innerHTML=`<div id="gtop"></div><div id="tm" class="timer"></div><div class="pl" id="cards"></div><div id="clsb"></div><div id="txt" class="txt"></div>
  <textarea id="ta" class="in" disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Bắt đầu gõ khi đếm ngược kết thúc…"></textarea><div id="tm2" class="timer2"></div><div id="res"></div>`;

  return `<div class="card"><h2 style="margin-top:0">🏫 Thi theo lớp</h2>`+(c?`<p>Đang có lớp <b>${esc(c.code)}</b> (${c.total} sinh viên, trạng thái: ${{open:'đang chờ',countdown:'chuẩn bị',running:'đang thi'}[c.status]||c.status}). Mỗi lúc chỉ có 1 lớp thi.</p><button onclick="openCls()">Mở màn hình điều khiển</button>`:
  `<div class="row"><div class="grow"><label>Mã lớp</label><input id="kc" maxlength="20" placeholder="SD2101" style="text-transform:uppercase"></div><div class="grow"><label>Mật khẩu lớp</label><input id="kp" maxlength="30" placeholder="ít nhất 3 ký tự"></div></div>
  <div class="row" style="margin-top:10px"><div><label>Sĩ số tối đa</label><input id="kx" type="number" min="2" max="100" value="60" style="width:100px"></div>${full?`<div class="grow"><label>Đoạn văn</label><select id="kt"><option value="-1">Ngẫu nhiên</option>${A.cfg.texts.map((t,i)=>`<option value="${i}">${esc(t.title||'Đoạn '+(i+1))}</option>`).join('')}</select></div>`:''}</div>
  <div class="row" style="margin-top:12px"><button onclick="createCls()">Tạo phòng thi lớp</button></div>
  <p class="mu">Sinh viên nhập mã lớp và mật khẩu ở trang chủ để vào phòng chờ. Khi bạn bấm “Bắt đầu thi”, cả lớp thi cùng lúc và không nhận thêm người. Mỗi lúc chỉ có 1 lớp thi. Thời gian thi theo lớp cố định <b>5 phút</b>${full?'':'; đoạn văn được chọn ngẫu nhiên từ kho do giám thị 1 quản lý'}.</p>`)
  +(SS.length?`<h3>Các buổi thi theo lớp đã lưu</h3><div style="max-height:260px;overflow:auto"><table><tr><th>Lớp</th><th>Thời gian</th><th>Sĩ số</th><th>Điểm TB</th><th></th></tr>${SS.map(x=>`<tr><td>${esc(x.code)}</td><td>${new Date(x.at).toLocaleString('vi-VN')}<br><span class="mu">${x.dur} phút</span></td><td>${x.count}</td><td>${x.avgScore}</td><td><button class="g" onclick="viewSess(${x.id})">Xem</button>${A.role===2?'':` <button class="g" onclick="renSess(${x.id},\'${esc(x.code)}\')">Đổi mã</button> <button class="g" onclick="delSess(${x.id})">✕ Xóa</button>`}</td></tr>`).join('')}</table></div>`:'')+`</div>`;
}
function createCls(){const cd=($('#kc').value||'').trim().toUpperCase();if(cd&&(A.sessions||[]).some(x=>x.code===cd)){alert('Mã lớp "'+cd+'" đã được dùng cho một buổi thi trước đó. Hãy đặt mã khác.');return}
  wantCls=true;tx({t:'clscreate',code:$('#kc').value,password:$('#kp').value,dur:5,max:+$('#kx').value,textIdx:$('#kt')?+$('#kt').value:-1})}
function openCls(){view='cls';render()}
function renSess(id,c){const n=prompt('Mã lớp mới (chữ, số, - hoặc _; phải duy nhất):',c);if(n&&n.trim().toUpperCase()!==c)tx({t:'rensession',id,code:n})}
function delSess(id){if(confirm('Xóa thống kê buổi thi này? (Điểm đã ghi vào bảng xếp hạng chung vẫn giữ nguyên.)'))tx({t:'delsession',id})}
function resetSess(){if(confirm('Xóa toàn bộ thống kê thi theo lớp? Không thể hoàn tác.'))tx({t:'resetsessions'})}
function clsView(a){
  a.innerHTML=`<div id="cl"></div><div class="row" style="justify-content:center;margin-top:14px">
  <button id="b1" onclick="tx({t:'clsstart'})">▶ Bắt đầu thi</button><button id="b2" class="g" onclick="if(confirm('Kết thúc sớm và chốt điểm?'))tx({t:'clsend'})">⏹ Kết thúc sớm</button>
  <button id="b3" class="g" onclick="if(confirm('Hủy lớp thi này?'))tx({t:'clscancel'})">✖ Hủy lớp</button><button id="b4" onclick="celTop()">🎉 Tung hô người đứng đầu</button></div>`;
  updCls();
}
function celTop(){if(CA&&CA.players.length)celebrate(CA.players[0])}
function updCls(){
  const el=$('#cl');if(!el)return;
  if(!CA){el.innerHTML='<div class="card mu">Chưa có lớp thi nào.</div>';return}
  const e=performance.now()-CA.t0,st=CA.status;
  const lb={open:'Đang chờ sinh viên',countdown:'Chuẩn bị',running:'Đang thi',finished:'Đã kết thúc',cancelled:'Đã hủy'}[st]||st;
  const tm=st==='open'?'Đang chờ…':st==='countdown'?'Chuẩn bị… '+Math.max(1,Math.ceil((CA.toStart-e)/1000)):st==='running'?fmt(CA.toEnd-e-300):st==='finished'?'Hết giờ':'Đã hủy';
  el.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🏫 Lớp ${esc(CA.code)}</h2><span class="tag">${lb}</span></div><p class="mu" style="margin:6px 0 0">Mật khẩu: <b>${esc(CA.password)}</b> · ${CA.dur} phút · Sĩ số: <b>${CA.total}</b>/${CA.max}</p></div><div class="timer">${tm}</div>
  <div class="card" style="padding:8px;overflow-x:auto"><table><tr><th>#</th><th style="text-align:left">Họ tên</th><th>MSSV</th><th>WPM</th><th>Chính xác</th><th>Tiến độ</th><th>Điểm</th><th></th></tr>${CA.players.map((p,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${esc(p.name)}</td><td>${esc(p.mssv)}</td><td>${p.wpm}</td><td>${p.acc}%</td><td>${Math.round(pct(p.correct,p.len))}%</td><td><b>${p.score}</b></td><td>${p.cheat?'🚩 '+esc(p.cheat):p.left?'Bỏ thi':p.done?'✔':p.disc?'Mất kết nối':''}${p.warn?' ⚠ '+esc(p.warn):''}</td></tr>`).join('')||'<tr><td colspan="8" class="mu">Chưa có sinh viên vào lớp.</td></tr>'}</table></div>`;
  const sh=(i,v)=>{const b=$(i);if(b)b.style.display=v?'':'none'};
  sh('#b1',st==='open');sh('#b2',st==='running');sh('#b3',st==='open'||st==='countdown');sh('#b4',st==='finished'&&CA.players.length&&CA.players[0].score>0);
  const b1=$('#b1');if(b1)b1.disabled=!CA.total;
}
let admDur=2;
function admLbInner(){const L=(A.lb&&A.lb[admDur])||[];return `<div class="tabs">${[1,2,3,4,5].map(d=>`<button class="${d===admDur?'':'g'}" onclick="setAdmLb(${d})">${d} phút</button>`).join('')}</div>`+(L.length?`<div style="max-height:320px;overflow:auto"><table><tr><th>Hạng</th><th style="text-align:left">Thí sinh</th><th>MSSV</th><th>Điểm</th><th></th></tr>${L.map((e,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${esc(e.name)}</td><td>${esc(e.mssv)}</td><td>${e.score}</td><td><button class="g" onclick="delLB('${esc(e.mssv)}',${admDur})">✕ Xóa</button></td></tr>`).join('')}</table></div>`:'<p class="mu">Chưa có dữ liệu.</p>')}
function setAdmLb(d){admDur=d;$('#alb').innerHTML=admLbInner()}
function delLB(k,d){if(confirm('Xóa điểm của '+k+' ở mốc '+d+' phút?'))tx({t:'dellb',mssv:k,dur:d})}
function resetLBd(){const d=+$('#rd').value;if(confirm('Xóa toàn bộ bảng xếp hạng mốc '+d+' phút? Không thể hoàn tác.'))tx({t:'resetlb',dur:d})}
function resetLB(){if(confirm('Xóa TOÀN BỘ bảng xếp hạng (cả 5 mốc thời gian)? Không thể hoàn tác.'))tx({t:'resetlb'})}
function resetHist(){if(confirm('Xóa toàn bộ lịch sử trận đấu? Không thể hoàn tác.'))tx({t:'resethist'})}
function resetAll(){const c=prompt('Xóa TOÀN BỘ sinh viên, bảng xếp hạng và lịch sử? Gõ XOA để xác nhận:');if(c==='XOA')tx({t:'resetall',confirm:'XOA'})}
function restoreFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(confirm('Khôi phục sẽ GHI ĐÈ toàn bộ dữ liệu hiện tại. Tiếp tục?'))tx({t:'restore',data:d})}catch(e){alert('File sao lưu không hợp lệ')}i.value=''};r.readAsText(f)}
function saveBackup(d){const u=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='typing-pro-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();URL.revokeObjectURL(u)}
function backFromLB(){view=(lbFrom==='admin'&&A)?'admin':'home';render()}
function viewSess(id){lbFrom='admin';clsSel=String(id);CR=null;lbDur='cls';view='lb';tx({t:'lb'});tx({t:'clsres',id});render()}
function procView(a){a.innerHTML=`<div class="card"><b>Giám thị lớp</b> <span class="mu">— bạn chỉ có quyền quản lý thi theo lớp: tạo lớp, chờ sinh viên vào, bắt đầu thi và xem kết quả.</span></div>${admClsCard()}`}
function adminView(a){if(A.role===2)return procView(a);
  const txt=A.cfg.texts.map(t=>t.title+'\n'+t.text).join('\n---\n');
  const H=A.history.slice().reverse();
  a.innerHTML=`${A.persist?'<div class="card" style="border-color:var(--ok)">✅ Dữ liệu được lưu vĩnh viễn trên cơ sở dữ liệu.</div>':'<div class="card" style="border-color:var(--bad)">⚠️ Chưa kết nối cơ sở dữ liệu: dữ liệu sẽ MẤT khi server khởi động lại. Xem README để cấu hình Upstash (miễn phí).</div>'}<div class="card"><h2 style="margin-top:0">Cấu hình cuộc thi</h2>
  <label>Thời gian mỗi lượt</label><select id="du" style="max-width:200px">${[1,2,3,4,5].map(m=>`<option value="${m}" ${m===A.cfg.duration?'selected':''}>${m} phút</option>`).join('')}</select>
  <label style="margin-top:12px">Đoạn văn (dòng 1 là tiêu đề, các dòng sau là nội dung; ngăn cách các đoạn bằng dòng ---)</label>
  <textarea id="tx" class="f" rows="10">${esc(txt)}</textarea>
  <div class="row" style="margin-top:12px"><button onclick="saveCfg()">Lưu cấu hình</button><span id="sv" class="mu"></span></div></div>
  <div class="card"><h2 style="margin-top:0">Phòng đang hoạt động</h2>${A.live.length?`<table>${A.live.map(r=>`<tr><td>${r.names.map(esc).join(' vs ')||'…'}</td><td>${{waiting:'Đang chờ',countdown:'Chuẩn bị',running:'Đang thi'}[r.status]||r.status}</td><td><button class="g" onclick="watch(${r.id})">👁 Theo dõi</button></td></tr>`).join('')}</table>`:'<p class="mu">Không có phòng nào.</p>'}</div>
  ${admClsCard()}
  <div class="card"><h2 style="margin-top:0">Quản lý dữ liệu</h2>
  <div class="row"><select id="rd" style="max-width:130px">${[1,2,3,4,5].map(m=>`<option value="${m}">${m} phút</option>`).join('')}</select><button class="g" onclick="resetLBd()">Xóa bảng xếp hạng mốc này</button><button class="g" onclick="resetLB()">Xóa toàn bộ bảng xếp hạng</button><button class="g" onclick="resetHist()">Xóa lịch sử trận đấu</button><button class="g" onclick="resetSess()">Xóa thống kê thi theo lớp</button></div>
  <div class="row" style="margin-top:10px"><button class="g" onclick="tx({t:'backup'})">⬇ Tải bản sao lưu</button><label class="mu" style="margin:0">⬆ Khôi phục từ file: <input type="file" accept=".json" style="width:auto" onchange="restoreFile(this)"></label><button style="background:var(--bad)" onclick="resetAll()">⚠ Xóa toàn bộ dữ liệu</button></div></div>
  <div class="card"><h2 style="margin-top:0">Bảng xếp hạng (quản lý từng dòng)</h2><div id="alb">${admLbInner()}</div></div>
  <div class="card"><h2 style="margin-top:0">Sinh viên đã đăng ký (${A.students.length})</h2>${A.students.length?`<div style="max-height:320px;overflow:auto"><table><tr><th>MSSV</th><th style="text-align:left">Họ tên</th><th></th></tr>${A.students.map(x=>`<tr><td>${esc(x.mssv)}</td><td style="text-align:left">${esc(x.name)}</td><td><button class="g" onclick="renStu('${esc(x.mssv)}')">Sửa tên</button> <button class="g" onclick="delStu('${esc(x.mssv)}')">Xóa</button></td></tr>`).join('')}</table></div>`:'<p class="mu">Chưa có sinh viên nào.</p>'}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Kết quả các cặp đã thi</h2><button class="g" onclick="csv()">Xuất CSV</button></div>
  ${H.length?`<table><tr><th>Cặp thi</th><th>Điểm</th><th>WPM</th><th>Chính xác</th><th>Thắng</th><th></th></tr>${H.map(h=>{const[a,b]=h.players;return`<tr><td>${esc(a.name)} (${esc(a.mssv)}) vs ${esc(b.name)} (${esc(b.mssv)})</td><td>${a.score} – ${b.score}</td><td>${a.wpm} – ${b.wpm}</td><td>${a.acc}% – ${b.acc}%</td><td>${h.winner<0?'Hòa':esc(h.players[h.winner].name)}</td><td><button class="g" onclick="celH(${A.history.indexOf(h)})">🎉</button></td></tr>`}).join('')}</table>`:'<p class="mu">Chưa có kết quả.</p>'}</div>`;
}
function saveCfg(){
  const texts=$('#tx').value.split(/\n---\n/).map(b=>{const l=b.trim().split('\n');return{title:l[0].trim(),text:l.slice(1).join(' ').trim()}}).filter(t=>t.text);
  if(!texts.length){$('#sv').textContent='Cần ít nhất 1 đoạn văn.';return}
  tx({t:'setcfg',duration:+$('#du').value,texts});$('#sv').textContent='Đã lưu ✔';
}
function csv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"',L=['MSSV 1,Thí sinh 1,Điểm 1,WPM 1,Chính xác 1,MSSV 2,Thí sinh 2,Điểm 2,WPM 2,Chính xác 2,Người thắng'];
  A.history.forEach(h=>{const[a,b]=h.players;L.push([a.mssv,a.name,a.score,a.wpm,a.acc,b.mssv,b.name,b.score,b.wpm,b.acc,h.winner<0?'Hòa':h.players[h.winner].name].map(q).join(','))});
  const u=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'})),l=document.createElement('a');
  l.href=u;l.download='ket-qua-typing-pro.csv';l.click();URL.revokeObjectURL(u);
}
setInterval(()=>{if(view==='spec')updSpec();else if(view==='cls')updCls()},250);
render();connect();
</script></body></html>
